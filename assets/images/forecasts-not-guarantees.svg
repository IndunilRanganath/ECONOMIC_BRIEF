<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><rect width="800" height="800" fill="#e9eddf"/><path d="M54 92H746" stroke="#193b32" opacity=".25"/><text x="54" y="65" fill="#193b32" font-family="Arial,sans-serif" font-size="17" letter-spacing="3">THE ECONOMIC BRIEF</text><circle cx="716" cy="58" r="14" fill="#193b32"/><text x="54" y="181" font-family="Arial,sans-serif" font-size="15" letter-spacing="3" fill="#193b32">THE IDEA, SIMPLY / FORECASTS</text><text x="54" y="300" font-family="Georgia,serif" font-size="64" fill="#193b32"><tspan x="54" dy="0">A forecast is</tspan><tspan x="54" dy="71">not a guarantee.</tspan></text><path d="M54 580H114" stroke="#193b32" stroke-width="3"/><text x="54" y="630" font-family="Arial,sans-serif" font-size="21" fill="#193b32">Compare the evidence. Consider the uncertainty.</text><path d="M54 704H746" stroke="#193b32" opacity=".25"/><text x="54" y="744" font-family="Arial,sans-serif" font-size="14" fill="#193b32" letter-spacing="2">EDUCATIONAL DEMONSTRATION</text><text x="746" y="746" text-anchor="end" font-family="Arial,sans-serif" font-size="27" fill="#193b32">↗</text></svg>